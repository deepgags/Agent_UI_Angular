<header class="search-container glass-header">
  <div class="container">
    <div class="row py-3 align-items-center">

      <!-- Contact + Social -->
      <div class="col-12 col-lg-4 d-flex align-items-center gap-4 flex-wrap">

        <!-- Phone -->
        <div class="d-flex align-items-center contact-item">
          <i class="fa-solid fa-phone info"></i>
          <a
            class="fw-semibold small text-decoration-none pop ms-2"
            [href]="'tel:' + siteConfig?.websiteSettings?.contactInfo?.phone | phone">
            {{ siteConfig?.websiteSettings?.contactInfo?.phone | phone }}
          </a>
        </div>

        <!-- Email -->
        <div class="d-flex align-items-center contact-item">
          <i class="fa-solid fa-envelope info"></i>
          <a
            class="fw-semibold small text-decoration-none pop ms-2"
            [href]="'mailto:' + siteConfig?.websiteSettings?.contactInfo?.email">
            {{ siteConfig?.websiteSettings?.contactInfo?.email }}
          </a>
        </div>

        <!-- Social Pills (Desktop) -->
        <div class="d-none d-lg-flex gap-2 social-pills">
          <a href="#" class="social-pill"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" class="social-pill"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" class="social-pill"><i class="fa-brands fa-linkedin-in"></i></a>
          <a href="#" class="social-pill"><i class="fa-brands fa-x-twitter"></i></a>
        </div>

        <!-- Mobile Social Toggle -->
        <button
          class="d-lg-none btn social-toggle"
          onclick="toggleSocialDrawer()">
          <i class="fa-solid fa-share-nodes"></i>
        </button>

      </div>

      <!-- Agent -->
      <div class="col-12 col-lg-4 text-center my-2 my-lg-0">
        <h5 class="fw-bold info mb-0 text-uppercase">
          {{ siteConfig?.firstName }} {{ siteConfig?.lastName }}
        </h5>
        <small class="text-muted fw-semibold">
          {{ siteConfig?.designation }}
        </small>
      </div>

      <!-- Brokerage -->
      <div class="col-12 col-lg-4 d-flex justify-content-center justify-content-lg-end">
        @if (siteConfig) {
          <a [routerLink]="['home']">
            <img
              [src]="siteConfig.websiteSettings.brokerageImage ? localImageUrl + siteConfig.websiteSettings.brokerageImage : '/images/Nologo.png'"
              height="56"
              alt="Brokerage Logo" />
          </a>
        }
      </div>

    </div>
  </div>


</header>

<app-menu />
