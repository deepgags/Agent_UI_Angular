<header class="editorial-header sticky-top">
  <div class="container-fluid search-container">
    <div class="row align-items-center g-3">

      <div class="col-12 col-lg-3 text-center text-lg-start">
          @if (siteConfig) {
              <a [routerLink]="['home']" class="brokerage-block">
                <img
                  [src]="siteConfig.websiteSettings.brokerageImage ? localImageUrl + siteConfig.websiteSettings.brokerageImage : '/images/Nologo.png'"
                  height="100"
                  alt="Brokerage Logo" />
              </a>
            }
      </div>

      <div class="col-12 col-lg-6 text-center">
        <h1 class="agent-title info mb-1">
          {{ siteConfig?.firstName }} {{ siteConfig?.lastName }}
        </h1>

        <div class="market-snapshot">
          <span class="value">{{ siteConfig?.designation }}</span>
        </div>
      </div>

      <div class="col-12 col-lg-3 text-center text-lg-end justify-content-end">
        <div class="contact-stack mb-2">
          <a
            class="contact-row"
            [href]="'tel:' + siteConfig?.websiteSettings?.contactInfo?.phone | phone">
            <i class="fa-solid fa-phone info"></i>
            {{ siteConfig?.websiteSettings?.contactInfo?.phone | phone }}
          </a>

          <a
            class="contact-row"
            [href]="'mailto:' + siteConfig?.websiteSettings?.contactInfo?.email">
            <i class="fa-solid fa-envelope info"></i>
            {{ siteConfig?.websiteSettings?.contactInfo?.email }}
          </a>
        </div>

        <a href="/contact" class="editorial-cta">
          Book a Private Showing
        </a>
      </div>

    </div>
  </div>
</header>

<app-menu />
