<header class="t13-header position-fixed w-100" style="z-index: 999;">
  <div class="container-fluid search-container-fluid">
    <div class="row align-items-center py-2 gx-0">

      <!-- Left: Logo only -->
      <div class="col-12 col-lg-4 d-flex align-items-center justify-content-center justify-content-lg-start px-3">
        @if (siteConfig) {
        <a [routerLink]="['home']" class="flex-shrink-0">
          <img [src]="siteConfig.websiteSettings.brokerageImage ? localImageUrl + siteConfig.websiteSettings.brokerageImage : '/images/Nologo.png'"
               alt="Brokerage Logo" style="max-height:99px;max-width:274px;width:auto;object-fit:contain;" />
        </a>
        }
      </div>

      <!-- Centre: Menu -->
      <div class="col-12 col-lg-4 t13-header-menu-col">
        <app-menu />
      </div>

      <!-- Right: Phone + Email + Social -->
      <div class="col-12 col-lg-4 d-none d-lg-flex flex-column align-items-end justify-content-center px-3 gap-1">
        <!-- Phone + Email stacked -->
        <div class="d-flex flex-column align-items-end gap-1">
          <a class="t13-meta-item" [href]="'tel:' + siteConfig?.websiteSettings?.contactInfo?.phone | phone">
            <i class="bi bi-telephone-fill info me-2"></i>{{ siteConfig?.websiteSettings?.contactInfo?.phone | phone }}
          </a>
          <a class="t13-meta-item" [href]="'mailto:' + siteConfig?.websiteSettings?.contactInfo?.email">
            <i class="bi bi-envelope-fill info me-2"></i>{{ siteConfig?.websiteSettings?.contactInfo?.email }}
          </a>
        </div>
      </div>

    </div>
  </div>
</header>

<div class="t13-top-pad"></div>
