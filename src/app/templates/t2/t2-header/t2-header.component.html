<div class="container-fluid search-container position-fixed bg-white" style="z-index: 999;">
  <div class="container">
    <div class="row  align-items-center justify-content-center">
  
      <div class="col-12 col-lg-3 ">
        <div class="text-center text-lg-start">
          <h3 class="fw-semibold info mb-0">
            {{ siteConfig?.businessName }}
          </h3>
        </div>
          <div class="mb-1">
              <div class="d-flex gap-2 justify-content-center justify-content-lg-start">
  
      @if (siteConfig.websiteSettings.socialLinks.facebook) {
      <a [href]="siteConfig.websiteSettings.socialLinks.facebook"
         target="_blank"
         rel="noopener noreferrer"
         class="btn btn-light border">
        <i class="bi bi-facebook orig facebook"></i>
      </a>
      }
  
      @if (siteConfig.websiteSettings.socialLinks.twitter) {
      <a [href]="siteConfig.websiteSettings.socialLinks.twitter"
         target="_blank"
         rel="noopener noreferrer"
         class="btn btn-light border">
        <i class="bi bi-twitter orig twitter"></i>
      </a>
      }
  
      @if (siteConfig.websiteSettings.socialLinks.instagram) {
      <a [href]="siteConfig.websiteSettings.socialLinks.instagram"
         target="_blank"
         rel="noopener noreferrer"
         class="btn btn-light border">
        <i class="bi bi-instagram orig instagram"></i>
      </a>
      }
  
      @if (siteConfig.websiteSettings.socialLinks.linkedin) {
      <a [href]="siteConfig.websiteSettings.socialLinks.linkedin"
         target="_blank"
         rel="noopener noreferrer"
         class="btn btn-light border">
        <i class="bi bi-linkedin orig linkedin"></i>
      </a>
      }
  
    </div>
          </div>
      </div>
      <!-- <div class="col-12 col-lg-6 d-flex flex-column flex-lg-row justify-content-center align-items-center py-lg-0 py-4">
        <div class="d-flex align-items-center mb-2 mb-lg-0">
          <i class="fa-solid fa-phone info"></i>
          <a class="text-dark fw-semibold  text-decoration-none pop ms-2"
             [href]="'tel:' + siteConfig?.websiteSettings?.contactInfo?.phone | phone">
            {{ siteConfig?.websiteSettings?.contactInfo?.phone | phone }}
          </a>
        </div>
        <div class="d-flex align-items-center ms-lg-5">
          <i class="fa-solid fa-envelope info"></i>
          <a class="text-dark fw-semibold  text-decoration-none pop ms-2"
             [href]="'mailto:' + siteConfig?.websiteSettings?.contactInfo?.email">
            {{ siteConfig?.websiteSettings?.contactInfo?.email }}
          </a>
        </div>
      </div> -->
  
      <div class="col-12 col-lg-3 d-flex justify-content-center justify-content-lg-end align-items-center gap-3">
        @if (siteConfig) {
        <a [routerLink]="['home']">
          <img [src]="siteConfig.websiteSettings.brokerageImage ? localImageUrl + siteConfig.websiteSettings.brokerageImage : '/images/Nologo.png'"
               alt="No brokerage logo"
               height="80px" />
        </a>
        }

                data-bs-target="#offcanvasRight"
                aria-controls="offcanvasRight">
          <i class="fa-solid fa-bars"></i>
        </button> -->
      </div>
    </div>
  </div>
</div>

<app-menu />
</div>
