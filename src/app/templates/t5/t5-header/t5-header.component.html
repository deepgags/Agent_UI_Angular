<header class="search-container glass-header sticky-top">
  <div class="container">
    <div class="row align-items-center py-3 header-inner">

      <!-- Brokerage -->
      <div class="col-lg-3 col-12 d-flex justify-content-center justify-content-lg-start">
        @if (siteConfig) {
        <a [routerLink]="['home']">
          <img
            [src]="siteConfig?.websiteSettings?.brokerageImage ? localImageUrl +siteConfig?.websiteSettings?.brokerageImage : '/images/Nologo.png'"
            height="48"
            alt="Brokerage Logo"
            class="broker-logo" />
        </a>
        }
      </div>

      <!-- Search -->
      <div class="col-lg-4 col-12 my-3 my-lg-0">

      </div>

      <!-- Agent + Contact -->
      <div class="col-lg-5 col-12">
        <div class="d-flex justify-content-center justify-content-lg-end align-items-center gap-4 flex-wrap">

          <div class="text-end agent-info">
            <div class="fw-bold text-uppercase text-white">
              {{ siteConfig?.firstName }} {{ siteConfig?.lastName }}
            </div>
            <small class="text-muted">
              {{ siteConfig?.designation }}
            </small>
          </div>

          <div class="d-flex gap-3">

            <a
              class="icon-pill"
              [href]="'tel:' + siteConfig?.websiteSettings?.contactInfo?.phone | phone">
              <i class="fa-solid fa-phone"></i>
            </a>

            <a
              class="icon-pill"
              [href]="'mailto:' + siteConfig?.websiteSettings?.contactInfo?.email">
              <i class="fa-solid fa-envelope"></i>
            </a>

          </div>
        </div>
      </div>

    </div>
  </div>
</header>
