<header class="search-container glass-header mb-2">
  <div class="container">
    <div class="row align-items-center py-3 g-3 header-row">

      <!-- Agent Branding -->
      <div class="col-lg-4 col-12 d-flex justify-content-center justify-content-lg-start">
        <div class="agent-brand text-center text-lg-start">
          <h3 class="fw-bold mb-0 text-white text-uppercase">
            {{ siteConfig?.firstName }} {{ siteConfig?.lastName }}
          </h3>
          <small class="text-white fw-semibold">
            {{ siteConfig?.designation }}
          </small>
        </div>
      </div>

      <!-- Center Actions -->
      <div class="col-lg-4 col-12 d-flex justify-content-center align-items-center gap-3 flex-wrap center-stack">

        <!-- Phone -->
        <div class="contact-pill">
          <i class="fa-solid fa-phone text-white"></i>
          <a
            class="fw-semibold small pop text-decoration-none"
            [href]="'tel:' + siteConfig?.websiteSettings?.contactInfo?.phone | phone">
            {{ siteConfig?.websiteSettings?.contactInfo?.phone | phone }}
          </a>
        </div>

        <!-- Email -->
        <div class="contact-pill">
          <i class="fa-solid fa-envelope text-white"></i>
          <a
            class="fw-semibold small pop text-decoration-none"
            [href]="'mailto:' + siteConfig?.websiteSettings?.contactInfo?.email">
            {{ siteConfig?.websiteSettings?.contactInfo?.email }}
          </a>
        </div>

      </div>

      <!-- Brokerage -->
      <div class="col-lg-4 col-12 d-flex justify-content-center justify-content-lg-end">
        @if (siteConfig) {
          <a [routerLink]="['home']" class="brokerage-badge">
            <img
              [src]="siteConfig.websiteSettings.brokerageImage ? localImageUrl + siteConfig.websiteSettings.brokerageImage : '/images/Nologo.png'"
              height="100"
              alt="Brokerage Logo" />
          </a>
        }
      </div>

    </div>

    <!-- Animated Underline -->
    <div class="scroll-underline"></div>
  </div>
</header>

<app-menu />
