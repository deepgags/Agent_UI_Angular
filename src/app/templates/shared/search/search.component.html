<p-dialog header="Search Filters"
		  [modal]="true"
		  [(visible)]="showFilterDialog"
		  [style]="{ width: '600px' }">

	<div class="row g-4">
		<div class="col-md-6">
			<p-inputnumber [(ngModel)]="filters.min_price"
						   mode="decimal"
						   [minFractionDigits]="0"
						   [maxFractionDigits]="2"
						   prefix="$"
						   placeholder="Min. Price"
						   class="w-100" />
		</div>
		<div class="col-md-6">
			<p-inputnumber [(ngModel)]="filters.max_price"
						   mode="decimal"
						   [minFractionDigits]="0"
						   [maxFractionDigits]="2"
						   prefix="$"
						   placeholder="Max. Price"
						   class="w-100" />
		</div>
		<div class="col-md-6">
			<p-select [options]="sqFtTypesDropDown"
					  [(ngModel)]="filters.sqFt"
					  optionLabel="label"
					  optionValue="value"
					  placeholder="Select Area"
					  appendTo="body"
					  class="w-100" />
		</div>
	</div>
	<div class="mt-4 d-flex gap-1 justify-content-end">
		<button type="button"
				class="btn btn-secondary btn-sm rounded-3 me-2"
				(click)="resetMoreFilters()">Reset</button>
		<!-- <button type="button"
				class="btn btn-secondary rounded-3 btn-sm">Close</button> -->
		<button type="button"
				class="btn search_btn btn-sm"
				(click)="searchProperties()">Apply</button>
	</div>
</p-dialog>

<div class="row justify-content-center search-container align-items-center gap-2">
	<div class="col-12 col-lg-auto p-0 mb-3 mb-lg-0">
		<!-- <input type="text"
			   [(ngModel)]="filters.address"
			   class="search-bar"
			   placeholder="City, Address, Postal Code, MLS®#" /> -->
		<!-- <input type="text"
			   [(ngModel)]="filters.address"
			   class="search-bar"
			   placeholder="City, Address, Postal Code, MLS®#" /> -->
		<p-autocomplete [(ngModel)]="filters.address"
						[suggestions]="cities"
						optionLabel="city"
						optionValue="city"
						placeholder="Search City"
						appendTo="body"
						(completeMethod)="searchCityProvince($event)" />

	</div>

	<div class="col-12 col-lg-auto p-0 mb-3 mb-lg-0">
		<p-select [options]="propertyTypesDropDown"
				  [(ngModel)]="filters.property_type"
				  optionLabel="LookupValue"
				  optionValue="LookupValue"
				  placeholder="Select Property Type"
				  appendTo="body"
				  (onChange)="filterPropertySubType()" />
	</div>

	<div class="col-12 col-lg-auto p-0 mb-3 mb-lg-0">
		<p-select [options]="propertySubTypesDropDown"
				  [(ngModel)]="filters.property_subtype"
				  optionLabel="LookupValue"
				  optionValue="LookupValue"
				  placeholder="Select Property Subtype"
				  appendTo="body" />
	</div>

	<div class="col-12 col-lg-auto p-0 mb-3 mb-lg-0">
		<p-select [options]="bedTypesDropDown"
				  [(ngModel)]="filters.bedrooms"
				  optionLabel="label"
				  optionValue="value"
				  placeholder="Bedrooms"
				  appendTo="body" />
	</div>

	<div class="col-12 col-lg-auto p-0 mb-3 mb-lg-0">
		<p-select [options]="bathTypesDropDown"
				  [(ngModel)]="filters.bathrooms"
				  optionLabel="label"
				  optionValue="value"
				  placeholder="Bathrooms"
				  appendTo="body" />
	</div>

	<div class="col-12 col-lg-auto p-0 mb-3 mb-lg-0">
		<p-select [options]="statusTypesDropDown"
				  [(ngModel)]="filters.property_status"
				  optionLabel="label"
				  optionValue="value"
				  placeholder="Select Property Status"
				  appendTo="body" />
	</div>

	<div class="col-12 col-lg-auto p-0 mb-3 mb-lg-0">
		<span (click)="openFilterDialog()">
			<i class="fa-solid fa-filter info fs-6 cursor"></i>
		</span>
	</div>

	<div class="col-12 col-lg-auto p-0 mb-3 mb-lg-0 d-flex align-items-center gap-2">
		<button type="button"
				class="btn btn-secondary btn-sm rounded-3"
				(click)="resetFilters()">Reset</button>

		<button type="button"
				class="btn search_btn btn-sm"
				(click)="searchProperties()">Search</button>

		@if (showMapSearch==true) {
		<button type="button"
				class="btn search_btn btn-sm"
				(click)="searchProperties(true)">Map Search</button>
		}
	</div>

</div>
