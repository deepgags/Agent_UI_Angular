<p-dialog
	header="Search Filters"
	[modal]="true"
	[(visible)]="showFilterDialog"
	[style]="{ width: 'min(600px, 95vw)' }">
	<div class="row g-4">
		<div class="col-md-6"></div>
		<div class="col-md-6"></div>
		<div class="col-md-2"></div>
	</div>
	<div class="mt-4 d-flex gap-1 justify-content-end">
		<button type="button" class="btn btn-secondary btn-sm rounded-3 me-2" (click)="resetMoreFilters()">Reset</button>
		<button type="button" class="btn btn-secondary rounded-3 btn-sm">Close</button>
		<button type="button" class="btn search_btn btn-sm" (click)="searchProperties()">Apply</button>
	</div>
</p-dialog>

<div class="search-heading-wrap">
  <h2 class="search-heading">Search Properties</h2>
  <p class="search-subheading">Find your perfect home by city, address, postal code or MLS#</p>
</div>

<div class="search-redesign">

  <!-- Row 1: Main search bar -->
  <div class="search-row-1">
    <div class="search-input-wrap">
      <i class="bi bi-search search-main-icon"></i>
      <p-autocomplete
        [(ngModel)]="filters.address"
        [suggestions]="propertiesSuggestions"
        optionLabel="address"
        optionValue="address"
        placeholder="Search City, Address, Postal Code, MLS#"
        appendTo="body"
        [lazy]="true"
        (completeMethod)="searchCityProvince($event)"
        (onSelect)="onSuggestionSelect()"
        styleClass="search-main-autocomplete">
        <ng-template let-property #item>
          <div class="d-flex align-items-center gap-3 p-2 border-bottom">
            <img [src]="propertyImageUrl + property.image" class="rounded" style="width:40px;height:40px;object-fit:cover;" />
            <div class="flex-grow-1">
              <strong>{{ property.address }}</strong><br />
              <small class="text-muted">MLS&reg;# {{ property.mls }}</small>
            </div>
          </div>
        </ng-template>
        <ng-template #header>
          <div class="font-medium px-3 py-2">Available Properties</div>
        </ng-template>
      </p-autocomplete>
    </div>
    <button type="button" class="search-btn-main" (click)="searchProperties()">
      <i class="bi bi-search me-2"></i>Search
    </button>
  </div>

  <!-- Row 2: Filter bar -->
  <div class="search-row-2">
    <div class="filter-row-inner">

      <div class="filter-item">
        <p-select
          [options]="propertyTypesDropDown"
          [(ngModel)]="filters.property_type"
          optionLabel="LookupValue"
          optionValue="LookupValue"
          placeholder="Property Type"
          appendTo="body"
          (onChange)="filterPropertySubType()" />
      </div>

      <div class="filter-divider d-none d-lg-block"></div>

      <div class="filter-item">
        <p-select
          [options]="propertySubTypesDropDown"
          [(ngModel)]="filters.property_subtype"
          optionLabel="LookupValue"
          optionValue="LookupValue"
          placeholder="Subtype"
          appendTo="body" />
      </div>

      <div class="filter-divider d-none d-lg-block"></div>

      <div class="filter-item">
        <p-select
          [options]="bedTypesDropDown"
          [(ngModel)]="filters.bedrooms"
          optionLabel="label"
          optionValue="value"
          placeholder="Bedrooms"
          appendTo="body" />
      </div>

      <div class="filter-divider d-none d-lg-block"></div>

      <div class="filter-item">
        <p-select
          [options]="bathTypesDropDown"
          [(ngModel)]="filters.bathrooms"
          optionLabel="label"
          optionValue="value"
          placeholder="Bathrooms"
          appendTo="body" />
      </div>

      <div class="filter-divider d-none d-lg-block"></div>

      <div class="filter-item">
        <p-select
          [options]="statusTypesDropDown"
          [(ngModel)]="filters.property_status"
          optionLabel="label"
          optionValue="value"
          placeholder="Status"
          appendTo="body" />
      </div>

      <div class="filter-divider d-none d-lg-block"></div>

      <div class="filter-item">
        <p-select
          [options]="sqFtTypesDropDown"
          [(ngModel)]="filters.sqFt"
          optionLabel="label"
          optionValue="value"
          placeholder="Area (sqft)"
          appendTo="body" />
      </div>

      <div class="filter-divider d-none d-lg-block"></div>

      <div class="filter-item filter-price">
        <span class="price-prefix">$</span>
        <p-inputnumber
          [(ngModel)]="filters.min_price"
          mode="decimal"
          [minFractionDigits]="0"
          [maxFractionDigits]="0"
          placeholder="Start Price"
          [useGrouping]="true" />
      </div>

      <div class="filter-price-sep d-none d-lg-flex">—</div>

      <div class="filter-item filter-price">
        <span class="price-prefix">$</span>
        <p-inputnumber
          [(ngModel)]="filters.max_price"
          mode="decimal"
          [minFractionDigits]="0"
          [maxFractionDigits]="0"
          placeholder="End Price"
          [useGrouping]="true" />
      </div>

      <div class="filter-actions">
        <button type="button" class="btn-reset" (click)="resetFilters()">
          <i class="bi bi-x-circle me-1"></i>Reset
        </button>
      </div>

    </div>
  </div>

</div>
