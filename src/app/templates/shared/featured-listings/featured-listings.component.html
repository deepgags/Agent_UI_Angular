		<div class="row justify-content-center">
			<h2 class=" fw-semibold text-center info mt-3">Search Your Dream Home</h2>
			<div class="col-12 bg-white py-4">
				<app-search [filters]="selectedFilters"

							class="search-container" />
			</div>
		</div>
	</div>
</div>
