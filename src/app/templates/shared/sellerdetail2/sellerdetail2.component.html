<div class="container-fluid p-0 search-container">
  <div class="position-relative">
    <img class="banner w-100"
         src="/images/banner3.png"
         alt="Banner Image">
    <div class="position-absolute top-50 start-50 translate-middle text-center">
      <h1 class="text-white fw-bold baner-text">Seller Details</h1>
    </div>
  </div>
</div>

@if (!siteConfig.websiteSettings.renovatingForResellText) {
  <div class="conatiner">
    <div [innerHTML]="renovatingText"></div>
  </div>
}

@if (siteConfig.websiteSettings.renovatingForResellText) {
  <div class="container">

    <div>
      <p [innerHTML]="siteConfig.websiteSettings.renovatingForResellText"></p>
    </div>
  </div>
}
