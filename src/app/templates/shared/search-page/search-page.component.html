@if (loading$ | async) {
  <div class="loading-container flex-content-center"
    >
    <div class="spinner">
    </div>
  </div>
}
<div class="container-fluid search-container">
  <div class="search-container">
    <div class="row justify-content-center align-items-center">
     <!-- <h2 class=" fw-semibold text-center mt-3">Search Your Dream Home</h2>-->
      <div class="col-10 bg-white py-4">
        <app-search [filters]="selectedFilters"
          [onSearch]="searchProperties"
          class="search-container" />
      </div>
      <div class="col-2">
        <select (ngModelChange)="sortChange($event)"
          [(ngModel)]="selectedFilters.sort"
          class="form-select custom-select">
          @for (sort of sortDropDown; track sort) {
            <option
            [value]="sort.value">{{sort.label}}</option>
          }
        </select>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid sec-3 search-container">
  @if (propertiesList && propertiesList.length>0) {
    <div class=""
      >
      <div class="row align-items-center justify-content-end">
        <div class="col-12 col-lg-2 p-0 mb-3 mb-lg-0">
        </div>
        <div class="col-12 col-lg-4 p-0 mb-3 mb-lg-0">
          <mat-paginator class="pb-3"
            [length]="propertiesList.length > 0 ? propertiesList[0].TotalRecords : 0"
            [pageIndex]="pageIndex-1"
            (page)="pageEvent = searchProperties(selectedFilters, $event)"
            [pageSize]="pageSize"
            [pageSizeOptions]="[12, 24, 36, 48, 60, 120]"
            aria-label="Select page">
          </mat-paginator>
        </div>
      </div>
      <div class="row g-4">
        @for (property of propertiesList; track property) {
          <div class="col-lg-4 col_32 col-md-6 col-sm-12 mb-lg-0 mb-3"
            >
            <app-property [property]="property"
              [onPropertyClick]="selectProperty" />
          </div>
        }
      </div>
      <mat-paginator class="py-3"
        [length]="propertiesList.length > 0 ? propertiesList[0].TotalRecords : 0"
        [pageIndex]="pageIndex-1"
        (page)="pageEvent = searchProperties(selectedFilters, $event)"
        [pageSize]="pageSize"
        [pageSizeOptions]="[12, 24, 36, 48, 60, 120]"
        aria-label="Select page">
      </mat-paginator>
    </div>
  }
  @if (propertiesList && propertiesList.length==0) {
    <h6>No properties found for selected criteria.</h6>
  }
</div>
