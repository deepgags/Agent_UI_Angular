<header class="monogram-header " id="monogramHeader">
  <div class="container border-bottom search-container">
    <div class="row align-items-center py-4">

      <div class="col-12 col-lg-4 ">
        <div class="monogram-block">

          <div>
            <h2 class="monogram-name info mb-0">
              {{ siteConfig?.businessName }}
            </h2>
            <p class="trust-line ">
              Residential · Luxury · Advisory
            </p>
          </div>

        </div>
      </div>

        <a
          class="meta-item"
          [href]="'tel:' + siteConfig?.websiteSettings?.contactInfo?.phone | phone">
         <i class="bi bi-telephone-fill info"></i>
          {{ siteConfig?.websiteSettings?.contactInfo?.phone | phone }}
        </a>

        <a
          class="meta-item"
          [href]="'mailto:' + siteConfig?.websiteSettings?.contactInfo?.email">
           <i class="bi bi-envelope-at-fill info"></i>
          {{ siteConfig?.websiteSettings?.contactInfo?.email }}
        </a>

       

      </div> -->

      <div class="col-12 col-lg-4 text-center text-lg-end ">

          <a [routerLink]="['home']" class="monogram-logo d-block mb-2">
            <img
              [src]="siteConfig.websiteSettings.brokerageImage ? localImageUrl + siteConfig.websiteSettings.brokerageImage : '/images/Nologo.png'"
