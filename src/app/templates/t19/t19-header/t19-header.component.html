<header class="premium-header" id="premiumHeader">
  <div class="container search-container">
    <div class="row py-3 align-items-center justify-content-center">

      <div class="col-12 col-lg-3 d-flex justify-content-center justify-content-lg-start">
        <div>
          <h4 class="fw-semibold info mb-0 agent-name">
            {{ siteConfig?.firstName }} {{ siteConfig?.lastName }}
          </h4>
          <p class="fw-semibold fs-6 mb-1 text-center text-lg-start">
            {{ siteConfig.designation }}
          </p>

          <span class="lux-divider"></span>
        </div>
      </div>

      <div class="col-12 col-lg-6 d-flex py-lg-0 py-3 justify-content-center gap-4 contact-wrap d-none d-lg-block">
        <a
          class="contact-pill"
          [href]="'tel:' + siteConfig?.websiteSettings?.contactInfo?.phone | phone">
              <i class="bi bi-telephone-fill info"></i>
          {{ siteConfig?.websiteSettings?.contactInfo?.phone | phone }}
        </a>

        <a
          class="contact-pill"
          [href]="'mailto:' + siteConfig?.websiteSettings?.contactInfo?.email">
                 <i class="bi bi-envelope-at-fill info"></i>
          {{ siteConfig?.websiteSettings?.contactInfo?.email }}
        </a>

        <a href="/contact" class="inline-cta">
          Book a Private Showing
        </a>
      </div>

      <div class="col-12 col-lg-3 d-flex justify-content-center justify-content-lg-end">
        @if (siteConfig) {
          <a [routerLink]="['home']" class="brokerage-logo">
            <img
              [src]="siteConfig.websiteSettings.brokerageImage ? localImageUrl + siteConfig.websiteSettings.brokerageImage : '/images/Nologo.png'"
              alt="No brokerage logo"
              height="80px" />
          </a>
        }
      </div>

    </div>
  </div>
</header>

<app-menu />
