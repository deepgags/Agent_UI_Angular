<div class="container-fluid p-0">
  <div class="">
    <app-navbar></app-navbar>  

    <div class="row mx-0">
      <div class="col-3 ps-0">
    <app-sidebar></app-sidebar>  

      </div>
      <div class="col mt-3">
        <h2>Page Manager</h2>
        <div class="border rounded">

            <div class="p-4">
              <!-- Create Page Button -->
              <div class="flex justify-end mb-3">
                <button 
                  pButton 
                  label="Create Page" 
                  icon="pi pi-plus" 
                  class="p-button-danger p-button-sm"
                  (click)="createPage()">
                </button>
              </div>
            
              <!-- Data Table -->
              <p-table [value]="pagedPages" responsiveLayout="scroll" styleClass="p-datatable-gridlines">
                <!-- Table Header -->
                <ng-template pTemplate="header">
                  <tr>
                    <th style="width: 70px; text-align: center;">S.NO</th>
                    <th style="min-width: 150px;">PAGE NAME</th>
                    <th style="min-width: 150px;">PAGE TITLE</th>
                    <th style="width: 100px; text-align: center;">PAGE INDEX</th>
                    <th style="min-width: 200px;">DATED</th>
                    <th style="width: 160px; text-align: center;">ACTION</th>
                  </tr>
                </ng-template>
            
                <!-- Table Body -->
                <ng-template pTemplate="body" let-page>
                  <tr>
                    <td style="text-align: center;">{{ page.sno }}</td>
                    <td>{{ page.pageName }}</td>
                    <td>{{ page.pageTitle }}</td>
                    <td style="text-align: center;">{{ page.pageIndex }}</td>
                    <td>{{ page.dated }}</td>
                    <td class="d-flex justify-center gap-2">
                      <button 
                        pButton 
                        label="Edit" 
                        icon="pi pi-pencil"
                        class="p-button-success p-button-sm mr-2">
                      </button>
                      <button 
                        pButton 
                        label="Delete" 
                        icon="pi pi-trash"
                        class="p-button-danger p-button-sm"
                        (click)="deletePage(page)">
                      </button>
                    </td>
                  </tr>
                </ng-template>
              </p-table>
            
              <!-- External Paginator -->
              <div class="mt-3">
                <p-paginator 
                  [rows]="rows" 
                  [totalRecords]="pages.length" 
                  [rowsPerPageOptions]="[5,10,20]" 
                  (onPageChange)="onPageChange($event)">
                </p-paginator>
              </div>
            </div>
        </div>

      </div>
    </div>
</div>
