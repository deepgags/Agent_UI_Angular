<div class="container-fluid p-0">
  <div class="">
    <app-navbar></app-navbar>  

    <div class="row mx-0">
      <div class="col-3 ps-0">
    <app-sidebar></app-sidebar>  

      </div>
      <div class="col mt-3">
        <h2>Leads List</h2>
        <div class="border rounded">

            <div class="p-4">
              <!-- Create Page Button -->
              <div class="d-flex justify-content-end mb-3">
                      <div class="gap-2 py-3">
              <input type="radio" class="btn-check" name="userType" id="seller" value="seller" checked required>
              <label class="btn  rounded-pill" for="seller">Seller</label>

              <input type="radio" class="btn-check" name="userType" id="buyer" value="buyer" required>
              <label class="btn  rounded-pill" for="buyer">Buyer</label>

              <input type="radio" class="btn-check" name="userType" id="renter" value="renter" required>
              <label class="btn  rounded-pill" for="renter">Renter</label>

              <input type="radio" class="btn-check" name="userType" id="buyerSeller" value="buyerAndSeller" required>
              <label class="btn  rounded-pill" for="buyerSeller">Buyer & Seller</label>

              <input type="radio" class="btn-check" name="userType" id="buyerSeller" value="buyerAndSeller" required>
              <label class="btn  rounded-pill" for="buyerSeller">Invester</label>
            </div>
              </div>
            
              <!-- Data Table -->
              <p-table [value]="pagedPages" responsiveLayout="scroll" styleClass="p-datatable-gridlines">
                <!-- Table Header -->
                <ng-template pTemplate="header">
                  <tr>
                    <th style="width: 70px; text-align: center;">S.NO</th>
                    <th style="min-width: 150px;">PAGE NAME</th>
                    <th style="min-width: 150px;">PAGE TITLE</th>
                    <th style="width: 100px; text-align: center;">PAGE INDEX</th>
                    <th style="min-width: 200px;">DATED</th>
                    <th style="width: 160px; text-align: center;">ACTION</th>
                  </tr>
                </ng-template>
            
                <!-- Table Body -->
                <ng-template pTemplate="body" let-page>
                  <tr>
                    <td style="text-align: center;">{{ page.sno }}</td>
                    <td>{{ page.pageName }}</td>
                    <td>{{ page.pageTitle }}</td>
                    <td style="text-align: center;">{{ page.pageIndex }}</td>
                    <td>{{ page.dated }}</td>
                    <td class="text-center">
  <div class="d-flex justify-center gap-2">
    <button 
      pButton 
      label="Edit" 
      icon="pi pi-pencil"
      class="p-button-success p-button-sm">
    </button>
    <button 
      pButton 
      label="Delete" 
      icon="pi pi-trash"
      class="p-button-danger p-button-sm"
      (click)="deletePage(page)">
    </button>
  </div>
</td>

                  </tr>
                </ng-template>
              </p-table>
            
              <!-- External Paginator -->
              <div class="mt-3">
                <p-paginator 
                  [rows]="rows" 
                  [totalRecords]="pages.length" 
                  [rowsPerPageOptions]="[5,10,20]" 
                  (onPageChange)="onPageChange($event)">
                </p-paginator>
              </div>
            </div>
        </div>

      </div>
    </div>
</div>
