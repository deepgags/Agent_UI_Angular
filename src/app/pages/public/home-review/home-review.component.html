<section class="hero d-flex flex-column justify-content-between">
  <div class="overlay"></div>

  <div class="container position-relative py-4 d-flex justify-content-between align-items-center">
    <img [src]="siteConfig.websiteSettings.brokerageImage ? siteConfig.websiteSettings.brokerageImage : '/images/Nologo.png'"
         height="60"
         alt="Dream Home">
    <a href="#"
       class="btn btn-warning fw-semibold px-4">Back To Home</a>
  </div>

  <div class="container position-relative pb-5 text-center text-white">
    <h2 class="fw-bold mb-2">Who do we send the evaluation to?</h2>

    <div class="row justify-content-center align-items-center mt-4 g-4">
      <div class="col-lg-6">
        <div *ngIf="selectedAddress"
             class="mb-3">
          <h5 class="text-white">{{ selectedAddress }}</h5>
        </div>
        <div class="ratio ratio-4x3 rounded-4 overflow-hidden shadow">
          <google-map [options]="mapOptions"
                      width="100%"
                      height="100%">
            <map-marker [options]="markerOptions"></map-marker>
          </google-map>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card p-4 text-start shadow-sm border-0"
             style="background-color: #f9f9f9;">
          <form [formGroup]="homeReviewForm"
                (ngSubmit)="submitHomeReviewForm()">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label small">Name :</label>
                <input type="text"
                       pInputText
                       formControlName="name"
                       class="form-control border rounded-pill"
                       placeholder="Name"
                       required />
                <span class="error"
                      *ngIf="name?.invalid && (name?.dirty || name?.touched)">
                  <span *ngIf="name?.errors?.['required']">Name is required</span>
                </span>
              </div>

              <div class="col-12">
                <label class="form-label small">Phone:</label>
                <p-inputmask mask="(999) 999-9999"
                             formControlName="phone"
                             placeholder="Ex. 123-456-1234"
                             class="w-100"
                             required></p-inputmask>
                <span class="error"
                      *ngIf="phone?.invalid && (phone?.dirty || phone?.touched)">
                  <span *ngIf="phone?.errors?.['required']">Phone number is required</span>
                </span>
              </div>

              <div class="col-12">
                <label class="form-label small">E-mail:</label>
                <input type="email"
                       pInputText
                       formControlName="email"
                       class="form-control border rounded-pill"
                       placeholder="E-mail"
                       required />
                <span class="error"
                      *ngIf="email?.invalid && (email?.dirty || email?.touched)">
                  <span *ngIf="email?.errors?.['required']">Email is required</span>
                  <span *ngIf="email?.errors?.['email']">Please enter a valid email address</span>
                </span>
              </div>

              <div class="col-12">
                <label class="form-label small">Selling in ?</label>
                <select class="form-select border rounded-pill"
                        formControlName="sellingIn"
                        required>
                  <option value=""
                          selected>Select an option</option>
                  <option>Right Away</option>
                  <option>1-3 Months</option>
                  <option>3-6 Months</option>
                  <option>6+ Months</option>
                </select>
                <span class="error"
                      *ngIf="sellingIn?.invalid && (sellingIn?.dirty || sellingIn?.touched)">
                  <span *ngIf="sellingIn?.errors?.['required']">Selling in is required</span>
                </span>
              </div>

              <div class="col-12 text-center mt-2">
                <button type="submit"
                        class="btn btn-warning w-100 rounded-pill py-2 fw-semibold text-white">
                  Submit
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
