<div class="">

  <section class="hero-section d-flex flex-column justify-content-between">
    <div class="overlay"></div>
    <div class="container position-relative py-4 d-flex justify-content-between align-items-center">
      <div class="container position-relative py-4 d-flex justify-content-between align-items-center">
        <img [src]="siteConfig.websiteSettings.brokerageImage ? localImageUrl + siteConfig.websiteSettings.brokerageImage : '/images/Nologo.png'"
             height="60"
             alt="Logo">
        <a href="#"
           class="btn btn-success fw-semibold px-4">Back To Home</a>
      </div>
    </div>

    <div class="container text-center position-relative my-auto">
      <h1 class="fw-bold display-5">Finding your <span class="text-success">Dream Home</span> has never been this easy!</h1>
      <p class="lead mt-3">Type your preferred location to get started.</p>

     <div class="input-group mb-4 shadow-sm rounded-pill overflow-hidden">
  <app-google-place
    [placeholder]="'Type your dream home\'s location...'"
    [onPlaceSelect]="onPlaceSelect"
    class="form-control border-0"
  ></app-google-place>

  <button
    (click)="submitAddress()"
    class="btn btn-success fw-semibold px-4 text-wrap"
    type="button"
  >
    Give Me Updates
  </button>
</div>


    </div>

           alt="Only Agents"
           height="50">
    </div> -->
  </section>

</div>
