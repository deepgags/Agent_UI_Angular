<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card p-4 col-md-5 col-lg-4">
    
    <!-- Icon Header -->
    <div class="text-center mb-3">
      <div class="icon-circle">
        <i class="fas fa-user-plus fs-5 text-dark"></i>
      </div>
    </div>

    <!-- Heading -->
    <h4 class="text-center fw-bold mb-2">Sign Up</h4>
    <p class="text-center text-muted mb-4">Create your account by filling the details below</p>

    <!-- Form -->
    <form>
      <!-- Name -->
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-user"></i></span>
        <input type="text" class="form-control" placeholder="Full Name" required>
      </div>

      <!-- Email -->
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
        <input type="email" class="form-control" placeholder="Email" required>
      </div>

      <!-- Phone -->
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-phone"></i></span>
        <input type="tel" class="form-control" placeholder="Phone Number" required>
      </div>

      <!-- Password -->
      <div class="mb-3 input-group">
        <span class="input-group-text"><i class="fas fa-lock"></i></span>
        <input type="password" class="form-control" placeholder="Password" required>
      </div>

      <!-- Submit Button -->
      <div class="d-grid">
        <button type="submit" class="btn btn-custom">Sign Up</button>
      </div>

      <!-- Already Account -->
      <p class="text-center mt-3 small">Already have an account? <a href="#">Login</a></p>
    </form>
  </div>
</div>
