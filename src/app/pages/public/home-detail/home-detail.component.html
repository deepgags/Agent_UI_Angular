
<section class="hero d-flex flex-column justify-content-between">
  <div class="overlay"></div>

  <!-- Top Bar -->
  <div class="container position-relative py-4 d-flex justify-content-between align-items-center">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/59/Home_logo.png" alt="Dream Home" height="60">
    <a href="#" class="btn btn-success fw-semibold px-4">Back To Home</a>
  </div>

  <!-- Main Content -->
  <div class="container position-relative my-auto text-center text-white">
    <h2 class="fw-bold mb-2">Good News! We found multiple properties in your selected area.</h2>
    <p class="lead">123 Edward Street Diagnostic Imaging, Edward Street, Toronto, ON, Canada</p>

    <div class="row justify-content-center align-items-start mt-4 g-4">
      <!-- Map Section -->
      <div class="col-lg-6">
        <div class="ratio ratio-4x3 rounded-4 overflow-hidden shadow">
          <iframe src="https://www.google.com/maps?q=Toronto&output=embed" allowfullscreen></iframe>
        </div>
      </div>

      <!-- Form Section -->
      <div class="col-lg-5">
        <div class="card card-glass p-4 text-start shadow-lg text-white">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small">Type Of Home*</label>
              <select class="form-select bg-dark text-white border-0 rounded-pill">
                <option>Type Of Home*</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small">Radius*</label>
              <select class="form-select bg-dark text-white border-0 rounded-pill">
                <option>200 Meters</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label small">Bed*</label>
              <select class="form-select bg-dark text-white border-0 rounded-pill">
                <option>Bed*</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small">Bath*</label>
              <select class="form-select bg-dark text-white border-0 rounded-pill">
                <option>Bath*</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label small">First Name*</label>
              <input type="text" class="form-control bg-dark text-white border-0 rounded-pill" placeholder="First Name*">
            </div>
            <div class="col-md-6">
              <label class="form-label small">Last Name*</label>
              <input type="text" class="form-control bg-dark text-white border-0 rounded-pill" placeholder="Last Name*">
            </div>

            <div class="col-12">
              <label class="form-label small">Phone*</label>
              <input type="text" class="form-control bg-dark text-white border-0 rounded-pill" placeholder="Phone Number">
            </div>
            <div class="col-12">
              <label class="form-label small">E-Mail ID*</label>
              <input type="email" class="form-control bg-dark text-white border-0 rounded-pill" placeholder="E-Mail ID">
            </div>

            <div class="col-12 text-center mt-3">
              <button class="btn btn-success w-100 rounded-pill py-2 fw-semibold">SUBMIT</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Logo -->
  <div class="container position-relative text-end py-3">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Logo_placeholder.svg" alt="Only Agents" height="50">
  </div>
</section>
