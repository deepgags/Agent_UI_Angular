<nav class="navbar navbar-expand-lg navbar-dark nav_bg position-sticky"
	 aria-label="Offcanvas navbar large"
	 *ngIf="agentData">
	<div class="container-fluid d-flex justify-content-between align-items-center">

		<!-- Brand -->
		<div>
			<a class="navbar-brand">{{agentData!.businessName}}</a>
			<a [href]="agentData.siteUrl"
			   target="_blank"
			   rel="noopener noreferrer"
			   class="ms-1 text-white website-link">View Site</a>

		</div>

		<!-- Right side buttons -->
		<div class="d-flex align-items-center">
			<img class="rounded-pill me-3"
				 [src]="agentData!.websiteSettings!.profileImage"
				 alt=""
				 style="width: 52px;">

			<p-menu #menu
					[model]="items"
					[popup]="true"
					appendTo="body" />

			<button type="button"
					class="btn btn-sm border-0 p-0 me-3 text-white"
					title="Menu"
					style="width: 32px; height: 32px"
					(click)="menu.toggle($event)">
				<i class="fas fa-ellipsis-v"></i>
			</button>

			<!-- Navbar toggler -->
			<button class="navbar-toggler"
					type="button"
					data-bs-toggle="offcanvas"
					data-bs-target="#offcanvasNavbar2"
					aria-controls="offcanvasNavbar2"
					aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
		</div>
	</div>
</nav>

<!-- Offcanvas OUTSIDE navbar -->
<div class="offcanvas offcanvas-end text-bg-dark"
	 tabindex="-1"
	 id="offcanvasNavbar2"
	 aria-labelledby="offcanvasNavbar2Label">
	<div class="offcanvas-header">
		<h5 class="offcanvas-title"
			id="offcanvasNavbar2Label">Menu</h5>
		<button type="button"
				class="btn-close btn-close-white"
				data-bs-dismiss="offcanvas"
				aria-label="Close"></button>
	</div>
	<div class="offcanvas-body">
		<ul class="navbar-nav justify-content-end flex-grow-1 pe-3 list-unstyled ps-0 mt-3">
			<li class="mb-1">
				<a routerLink="/dashboard"
				   routerLinkActive="active"
				   class="d-flex align-items-center text-white text-decoration-none py-2">
					<i class="bi bi-speedometer2 me-2"></i> Dashboard
				</a>
			</li>

			<li class="mb-1">
				<a routerLink="/template"
				   routerLinkActive="active"
				   class="d-flex align-items-center text-dark text-decoration-none py-2">
					<i class="bi bi-cart me-2"></i> Templates
				</a>
			</li>

			<li class="mb-1">
				<a routerLink="/page-manager"
				   routerLinkActive="active"
				   class="d-flex align-items-center text-white text-decoration-none py-2">
					<i class="bi bi-person me-2"></i> Page Manager
				</a>
			</li>

			<li class="mb-1">
				<a routerLink="/menu-manager"
				   routerLinkActive="active"
				   class="d-flex align-items-center text-white text-decoration-none py-2">
					<i class="bi bi-list me-2"></i> Menu Manager
				</a>
			</li>

			<li class="mb-1">
				<a routerLink="/leads"
				   routerLinkActive="active"
				   class="d-flex align-items-center text-white text-decoration-none py-2">
					<i class="bi bi-building me-2"></i> Leads List
				</a>
			</li>

			<li class="mb-1">
				<a routerLink="/settings"
				   routerLinkActive="active"
				   class="d-flex align-items-center text-white text-decoration-none py-2">
					<i class="bi bi-calendar-check me-2"></i> Settings
				</a>
			</li>

			<li class="mb-1">
				<a routerLink="/users"
				   routerLinkActive="active"
				   class="d-flex align-items-center text-white text-decoration-none py-2">
					<i class="bi bi-people me-2"></i> Registered Users
				</a>
			</li>

		</ul>
	</div>
</div>
