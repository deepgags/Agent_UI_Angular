			<!-- Loading State -->
			<div *ngIf="loading"
				 class="text-center py-4">
				<p-progressSpinner></p-progressSpinner>
				<p class="mt-2">Loading leads...</p>
			</div>

			<!-- Error State -->
			<div *ngIf="error"
				 class="alert alert-danger"
				 role="alert">
				{{ error }}
				<button class="btn btn-outline-danger btn-sm ms-2"
						(click)="getLeads()">Retry</button>
			</div>

			<!-- Search -->
			<div *ngIf="!loading && !error"
				 class="d-flex gap-2 p-3">
				<p-select [options]="searchFields"
						  [(ngModel)]="selectedField"
						  (ngModelChange)="applyFilter()"
						  optionLabel="label"
						  optionValue="value"
						  class="w-auto"
						  appendTo="body" />
				<input type="text"
					   class="form-control w-auto"
					   placeholder="Search leads..."
					   [(ngModel)]="searchText"
					   (ngModelChange)="applyFilter()" />
			</div>

			<!-- Data Table -->
			<div *ngIf="!loading && !error">
				<app-simple-table [columns]="columns"
								  [data]="filteredLeads"
								  [paginator]="true"
								  [rows]="25"
								  [showFilter]="false"
								  [showActions]="true"
								  [showEditAction]="false"
								  [showDeleteAction]="true"
								  [onDelete]="deleteLead"
								  [onEdit]="openLeadDetails"
								  [highlightRow]="true"
								  #table>
				</app-simple-table>
			</div>
		</div>

	</div>
