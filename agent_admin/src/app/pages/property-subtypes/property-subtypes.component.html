<div class="page-header"><h1 class="page-title">Property Subtypes</h1><p class="page-subtitle">Manage property subtypes.</p></div>
<div class="card">
  <p-toolbar><ng-template #end><button pButton label="Add Subtype" icon="pi pi-plus" (click)="openDialog()"></button></ng-template></p-toolbar>
  <p-table [value]="items()" [paginator]="true" [rows]="10" [loading]="loading()">
    <ng-template pTemplate="header"><tr><th>Name</th><th>Property Type</th><th class="text-right">Actions</th></tr></ng-template>
    <ng-template pTemplate="body" let-item><tr><td>{{ item.LookupValue }}</td><td>{{ getPropertyTypeName(item.propertyTypeId) }}</td>
      <td class="text-right"><button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="editItem(item)"></button><button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="deleteItem(item)"></button></td></tr></ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="3" class="empty-state">No subtypes found.</td></tr></ng-template>
  </p-table>
</div>
<p-dialog [(visible)]="dialogVisible" [header]="isEdit ? 'Edit Subtype' : 'Add Subtype'" [modal]="true" [style]="{width: '400px'}">
  <form [formGroup]="form">
    <div class="form-group"><label class="form-label">Name</label><input pInputText formControlName="name" class="w-full" /></div>
    <div class="form-group"><label class="form-label">Property Type</label><p-select [options]="propertyTypes" formControlName="propertyTypeId" class="w-full" appendTo="body"></p-select></div>
  </form>
  <ng-template #footer><button pButton label="Cancel" class="p-button-text" (click)="dialogVisible = false"></button><button pButton label="Save" (click)="onSave()" [disabled]="form.invalid"></button></ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog><p-toast></p-toast>
