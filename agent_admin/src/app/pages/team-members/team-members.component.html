<div class="page-header">
  <h1 class="page-title">Team Members</h1>
  <p class="page-subtitle">Manage your team members.</p>
</div>
<div class="card">
  <p-toolbar>
    <ng-template #start>
      <input pInputText placeholder="Search..." [(ngModel)]="searchQuery" (input)="onSearch()" class="mr-2" />
    </ng-template>
    <ng-template #end>
      <button pButton label="Add Team Member" icon="pi pi-plus" (click)="openDialog()"></button>
    </ng-template>
  </p-toolbar>
  <p-table [value]="items()" [lazy]="true" (onLazyLoad)="onLazyLoad($event)" [paginator]="true" [rows]="rows()" [first]="first()" [totalRecords]="totalRecords()" [loading]="loading()">
    <ng-template pTemplate="header">
      <tr><th>Name</th><th>Role</th><th>Email</th><th>Phone</th><th class="text-right">Actions</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr><td>{{ item.firstName }} {{ item.lastName }}</td><td>{{ item.designation }}</td><td>{{ item.emailAddress }}</td><td>{{ item.phoneNumber }}</td>
        <td class="text-right">
          <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="editItem(item)"></button>
          <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="deleteItem(item)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="5" class="empty-state">No team members found.</td></tr></ng-template>
  </p-table>
</div>
<p-dialog [(visible)]="dialogVisible" [header]="isEdit ? 'Edit Team Member' : 'Add Team Member'" [modal]="true" [style]="{width: '500px'}">
  <form [formGroup]="form">
    <div class="form-group"><label class="form-label">First Name</label><input pInputText formControlName="firstName" class="w-full" /></div>
    <div class="form-group"><label class="form-label">Last Name</label><input pInputText formControlName="lastName" class="w-full" /></div>
    <div class="form-group"><label class="form-label">Designation</label><input pInputText formControlName="designation" class="w-full" /></div>
    <div class="form-group"><label class="form-label">Email</label><input pInputText formControlName="emailAddress" class="w-full" /></div>
    <div class="form-group"><label class="form-label">Phone</label><input pInputText formControlName="phoneNumber" class="w-full" /></div>
  </form>
  <ng-template #footer>
    <button pButton label="Cancel" class="p-button-text" (click)="dialogVisible = false"></button>
    <button pButton label="Save" (click)="onSave()" [disabled]="form.invalid"></button>
  </ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
