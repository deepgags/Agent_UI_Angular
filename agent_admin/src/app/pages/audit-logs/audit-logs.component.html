<div class="page-header"><h1 class="page-title">Audit Logs</h1><p class="page-subtitle">View system audit logs.</p></div>
<div class="card">
  <p-toolbar><ng-template #start><input pInputText placeholder="Search..." [(ngModel)]="searchQuery" (input)="onSearch()" class="mr-2" /></ng-template></p-toolbar>
  <p-table [value]="items()" [lazy]="true" (onLazyLoad)="onLazyLoad($event)" [paginator]="true" [rows]="rows()" [first]="first()" [totalRecords]="totalRecords()" [loading]="loading()">
    <ng-template pTemplate="header"><tr><th>Action</th><th>Entity</th><th>Entity ID</th><th>User</th><th>Timestamp</th><th>Details</th></tr></ng-template>
    <ng-template pTemplate="body" let-item><tr><td>{{ item.action }}</td><td>{{ item.entity }}</td><td>{{ item.entityId }}</td><td>{{ item.user }}</td><td>{{ item.timestamp | date: 'medium' }}</td><td>{{ item.details }}</td></tr></ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="6" class="empty-state">No logs found.</td></tr></ng-template>
  </p-table>
</div>
