<div class="page-header">
  <h1 class="page-title">System Admins</h1>
  <p class="page-subtitle">Manage system users.</p>
</div>
<div class="card">
  <p-toolbar>
    <ng-template #start>
      <input pInputText placeholder="Search..." [(ngModel)]="searchQuery" (input)="onSearch()" class="mr-2" />
    </ng-template>
    <ng-template #end>
      <button pButton label="Add System Admin" icon="pi pi-plus" (click)="openDialog()"></button>
    </ng-template>
  </p-toolbar>
  <p-table [value]="items()" [paginator]="true" [rows]="10" [loading]="loading()">
    <ng-template pTemplate="header">
      <tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th class="text-right">Actions</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr><td>{{ item.name }}</td><td>{{ item.email }}</td><td>{{ item.phone }}</td><td>{{ item.role }}</td>
        <td><p-tag [value]="item.isActive ? (item.isVerified ? 'Verified' : 'Pending') : 'Inactive'" [severity]="getStatusSeverity(item.isVerified, item.isActive)"></p-tag></td>
        <td class="text-right">
          <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="editItem(item)"></button>
          <button pButton icon="pi pi-key" class="p-button-text p-button-sm" (click)="resetPassword(item)"></button>
          <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="deleteItem(item)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="6" class="empty-state">No system admins found.</td></tr></ng-template>
  </p-table>
</div>
<p-dialog [(visible)]="dialogVisible" [header]="isEdit ? 'Edit System Admin' : 'Add System Admin'" [modal]="true" [style]="{width: '500px'}">
  <form [formGroup]="form">
    <div class="form-group"><label class="form-label">Name</label><input pInputText formControlName="name" class="w-full" /></div>
    <div class="form-group"><label class="form-label">Email</label><input pInputText formControlName="email" class="w-full" /></div>
    <div class="form-group"><label class="form-label">Phone</label><input pInputText formControlName="phone" class="w-full" /></div>
    <div class="form-group"><label class="form-label">Role</label><p-select [options]="roles" formControlName="role" class="w-full" appendTo="body"></p-select></div>
  </form>
  <ng-template #footer>
    <button pButton label="Cancel" class="p-button-text" (click)="dialogVisible = false"></button>
    <button pButton label="Save" (click)="onSave()" [disabled]="form.invalid"></button>
  </ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
