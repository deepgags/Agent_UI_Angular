<div class="page-header">
  <h1 class="page-title">Menus</h1>
  <p class="page-subtitle">Manage navigation menus.</p>
</div>
<div class="card">
  <p-toolbar>
    <ng-template #start>
      <input pInputText placeholder="Search..." [(ngModel)]="searchQuery" (input)="onSearch()" class="mr-2" />
    </ng-template>
    <ng-template #end>
      <button pButton label="Add Menu" icon="pi pi-plus" (click)="openDialog()"></button>
    </ng-template>
  </p-toolbar>
  <p-table [value]="items()" [paginator]="true" [rows]="10" [loading]="loading()">
    <ng-template pTemplate="header">
      <tr><th>Name</th><th>Slug</th><th>Items</th><th class="text-right">Actions</th></tr>
    </ng-template>
    <ng-template pTemplate="header">
      <tr><th>Name</th><th>Type</th><th>Category</th><th class="text-right">Actions</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr><td>{{ item.name }}</td><td>{{ item.menuType }}</td><td>{{ item.menuCategory }}</td>
        <td class="text-right">
          <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="editItem(item)"></button>
          <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="deleteItem(item)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="4" class="empty-state">No menus found.</td></tr></ng-template>
  </p-table>
</div>
<p-dialog [(visible)]="dialogVisible" [header]="isEdit ? 'Edit Menu' : 'Add Menu'" [modal]="true" [style]="{width: '500px'}">
  <form [formGroup]="form">
    <div class="form-group"><label class="form-label">Name</label><input pInputText formControlName="name" class="w-full" /></div>
    <div class="form-group">
      <label class="form-label">Type</label>
      <select pInputText formControlName="menuType" class="w-full">
        <option value="page">Page</option>
        <option value="link">Link</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <select pInputText formControlName="menuCategory" class="w-full">
        <option value="main">Main</option>
        <option value="side">Side</option>
      </select>
    </div>
    <div class="form-group" *ngIf="form.value.menuType === 'page'">
      <label class="form-label">Page Key</label><input pInputText formControlName="pageKey" class="w-full" />
    </div>
    <div class="form-group" *ngIf="form.value.menuType === 'link'">
      <label class="form-label">Link URL</label><input pInputText formControlName="linkUrl" class="w-full" />
    </div>
    <div class="form-group"><label class="form-label">Order</label><input pInputText type="number" formControlName="order" class="w-full" /></div>
  </form>
  <ng-template #footer>
    <button pButton label="Cancel" class="p-button-text" (click)="dialogVisible = false"></button>
    <button pButton label="Save" (click)="onSave()" [disabled]="form.invalid"></button>
  </ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
