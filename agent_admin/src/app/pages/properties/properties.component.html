<div class="page-header">
  <h1 class="page-title">Properties</h1>
  <p class="page-subtitle">View property details.</p>
</div>
<div class="card">
  <p-toolbar>
    <ng-template #start>
      <input pInputText placeholder="Search..." [(ngModel)]="searchQuery" (input)="onSearch()" class="mr-2" />
    </ng-template>
  </p-toolbar>
  <p-table [value]="items()" [paginator]="true" [rows]="10" [loading]="loading()">
    <ng-template pTemplate="header">
      <tr>
        <th>MLS ID</th>
        <th>Address</th>
        <th>City</th>
        <th>Price</th>
        <th>Type</th>
        <th>Beds/Baths</th>
        <th>Status</th>
        <th class="text-right">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr (click)="onRowClick(item)" style="cursor: pointer">
        <td>{{ item.ListingKey }}</td>
        <td>{{ item.UnparsedAddress }}</td>
        <td>{{ item.City }}</td>
        <td>{{ item.ListPrice | currency }}</td>
        <td>{{ item.PropertyType }}</td>
        <td>{{ item.BedroomsTotal }}/{{ item.BathroomsTotal }}</td>
        <td>
          <p-tag [value]="item.ContractStatus" [severity]="getStatusSeverity(item.ContractStatus)"></p-tag>
        </td>
        <td class="text-right">
          <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="deleteItem(item); $event.stopPropagation()"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="8" class="empty-state">No properties found.</td></tr>
    </ng-template>
  </p-table>
</div>
<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
