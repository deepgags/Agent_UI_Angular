<div class="page-header">
  <h1 class="page-title">Properties</h1>
  <p class="page-subtitle">Manage properties.</p>
</div>
<div class="card">
  <p-toolbar>
    <ng-template #start>
      <input pInputText placeholder="Search..." [(ngModel)]="searchQuery" (input)="onSearch()" class="mr-2" />
    </ng-template>
    <ng-template #end>
      <button pButton label="Add Property" icon="pi pi-plus" (click)="openDialog()"></button>
    </ng-template>
  </p-toolbar>
  <p-table [value]="items()" [paginator]="true" [rows]="10" [loading]="loading()">
    <ng-template pTemplate="header">
      <tr>
        <th>MLS ID</th>
        <th>Address</th>
        <th>City</th>
        <th>Price</th>
        <th>Type</th>
        <th>Beds/Baths</th>
        <th>Status</th>
        <th class="text-right">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.ListingKey }}</td>
        <td>{{ item.UnparsedAddress }}</td>
        <td>{{ item.City }}</td>
        <td>{{ item.ListPrice | currency }}</td>
        <td>{{ item.PropertyType }}</td>
        <td>{{ item.BedroomsTotal }}/{{ item.BathroomsTotal }}</td>
        <td>
          <p-tag [value]="item.ContractStatus" [severity]="getStatusSeverity(item.ContractStatus)"></p-tag>
        </td>
        <td class="text-right">
          <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="editItem(item)"></button>
          <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="deleteItem(item)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="8" class="empty-state">No properties found.</td></tr>
    </ng-template>
  </p-table>
</div>
<p-dialog [(visible)]="dialogVisible" [header]="isEdit ? 'Edit Property' : 'Add Property'" [modal]="true" [style]="{width: '500px'}">
  <form [formGroup]="form">
    <div class="form-group"><label class="form-label">Address</label><input pInputText formControlName="UnparsedAddress" class="w-full" /></div>
    <div class="form-group"><label class="form-label">City</label><input pInputText formControlName="City" class="w-full" /></div>
    <div class="form-group"><label class="form-label">State</label><input pInputText formControlName="StateOrProvince" class="w-full" /></div>
    <div class="form-group"><label class="form-label">Zip Code</label><input pInputText formControlName="PostalCode" class="w-full" /></div>
    <div class="form-group"><label class="form-label">Price</label><p-inputNumber formControlName="ListPrice" class="w-full" mode="currency" currency="USD"></p-inputNumber></div>
    <div class="form-group"><label class="form-label">Property Type</label><input pInputText formControlName="PropertyType" class="w-full" /></div>
  </form>
  <ng-template #footer>
    <button pButton label="Cancel" class="p-button-text" (click)="dialogVisible = false"></button>
    <button pButton label="Save" (click)="onSave()" [disabled]="form.invalid"></button>
  </ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
