<div class="page-header">
  <h1 class="page-title">Profile</h1>
  <p class="page-subtitle">Manage your account settings.</p>
</div>
<div class="card">
  <div class="profile-info">
    <h2>Account Information</h2>
    <div class="info-row">
      <label>Name:</label>
      <span>{{ user()?.name }}</span>
    </div>
    <div class="info-row">
      <label>Email:</label>
      <span>{{ user()?.email }}</span>
    </div>
    <div class="info-row">
      <label>Role:</label>
      <span>{{ user()?.role }}</span>
    </div>
  </div>
</div>
<div class="card mt-4">
  <h2>Change Password</h2>
  <form [formGroup]="passwordForm" (ngSubmit)="onChangePassword()">
    <div class="form-group">
      <label class="form-label">Current Password</label>
      <p-password formControlName="currentPassword" [feedback]="false" [toggleMask]="true" class="w-full"></p-password>
    </div>
    <div class="form-group">
      <label class="form-label">New Password</label>
      <p-password formControlName="newPassword" class="w-full"></p-password>
    </div>
    <div class="form-group">
      <label class="form-label">Confirm New Password</label>
      <p-password formControlName="confirmPassword" [feedback]="false" [toggleMask]="true" class="w-full"></p-password>
    </div>
    <button pButton label="Change Password" type="submit" [disabled]="passwordForm.invalid || passwordForm.value.newPassword !== passwordForm.value.confirmPassword"></button>
  </form>
</div>
<p-toast></p-toast>
