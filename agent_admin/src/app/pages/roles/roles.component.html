<div class="page-header">
  <h1 class="page-title">Roles</h1>
  <p class="page-subtitle">Manage system roles and permissions.</p>
</div>
<div class="card">
  <p-toolbar>
    <ng-template #end>
      <button pButton label="Add Role" icon="pi pi-plus" (click)="openDialog()"></button>
    </ng-template>
  </p-toolbar>
  <p-table [value]="items()" [paginator]="true" [rows]="10" [loading]="loading()">
    <ng-template pTemplate="header">
      <tr><th>Name</th><th>Description</th><th>Permissions</th><th class="text-right">Actions</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr><td>{{ item.name }}</td><td>{{ item.description }}</td><td>{{ item.permissions?.length || 0 }}</td>
        <td class="text-right">
          <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="editItem(item)"></button>
          <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="deleteItem(item)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="4" class="empty-state">No roles found.</td></tr></ng-template>
  </p-table>
</div>
<p-dialog [(visible)]="dialogVisible" [header]="isEdit ? 'Edit Role' : 'Add Role'" [modal]="true" [style]="{width: '500px'}">
  <form [formGroup]="form">
    <div class="form-group"><label class="form-label">Name</label><input pInputText formControlName="name" class="w-full" /></div>
    <div class="form-group"><label class="form-label">Description</label><input pInputText formControlName="description" class="w-full" /></div>
  </form>
  <ng-template #footer>
    <button pButton label="Cancel" class="p-button-text" (click)="dialogVisible = false"></button>
    <button pButton label="Save" (click)="onSave()" [disabled]="form.invalid"></button>
  </ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
