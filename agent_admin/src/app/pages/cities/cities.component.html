<div class="page-header"><h1 class="page-title">Cities</h1><p class="page-subtitle">Manage cities.</p></div>
<div class="card">
  <p-toolbar><ng-template #end><button pButton label="Add City" icon="pi pi-plus" (click)="openDialog()"></button></ng-template></p-toolbar>
  <p-table [value]="items()" [lazy]="true" (onLazyLoad)="onLazyLoad($event)" [paginator]="true" [rows]="rows()" [first]="first()" [totalRecords]="totalRecords()" [loading]="loading()">
    <ng-template pTemplate="header"><tr><th>City</th><th>Province</th><th class="text-right"> Actions</th></tr></ng-template>
    <ng-template pTemplate="body" let-item><tr><td>{{ item.city }}</td><td>{{ item.province_name }}</td>
      <td class="text-right"><button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" (click)="editItem(item)"></button><button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="deleteItem(item)"></button></td></tr></ng-template>
    <ng-template pTemplate="emptymessage"><tr><td colspan="3" class="empty-state">No cities found.</td></tr></ng-template>
  </p-table>
</div>
<p-dialog [(visible)]="dialogVisible" [header]="isEdit ? 'Edit City' : 'Add City'" [modal]="true" [style]="{width: '400px'}">
  <form [formGroup]="form"><div class="form-group"><label class="form-label">City Name</label><input pInputText formControlName="name" class="w-full" /></div><div class="form-group"><label class="form-label">Province ID</label><input pInputText formControlName="province" class="w-full" /></div></form>
  <ng-template #footer><button pButton label="Cancel" class="p-button-text" (click)="dialogVisible = false"></button><button pButton label="Save" (click)="onSave()" [disabled]="form.invalid"></button></ng-template>
</p-dialog>
<p-confirmDialog></p-confirmDialog><p-toast></p-toast>
